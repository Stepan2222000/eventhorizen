errors:
  - id: e-box-20260212-001
    file: client/src/pages/box-details.tsx
    category: state-corruption
    severity: critical

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Инвентаризация в BoxDetails отправляет корректировки в цикле:
      по одному POST /api/movements на каждую строку расхождения.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Если часть запросов прошла успешно, а один из следующих упал (сеть/500/конфликт),
      система получает частично применённую инвентаризацию.
      Пользователь видит общую ошибку и часто нажимает "Применить" снова, что
      создаёт повторные корректировки для уже применённых строк и искажает остатки.

      КАК ДОЛЖНО РАБОТАТЬ:
      Применение инвентаризации должно быть атомарным:
      либо один backend batch-эндпоинт в транзакции, либо минимум защита от повторного
      применения уже успешно отправленных строк.

    code_example: |
      # client/src/pages/box-details.tsx
      const diffs = inventoryDiffs.filter((r) => r.diff !== 0);
      for (const r of diffs) {
        await apiRequest("POST", "/api/movements", {
          smart: r.smart,
          qtyDelta: r.diff,
          reason: "adjust",
          note: `Инвентаризация: расхождение ${r.diff}`,
          boxNumber: box.name,
        });
      }

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-12T00:23:38+04:00
        agrees: true
        note: "Раунд 3/4: глубокий анализ инвентаризации и сценария частичного фейла"

    fix: null

  - id: e-box-20260212-002
    file: client/src/pages/boxes.tsx
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Страница /boxes читает только data/isLoading и не обрабатывает isError/error.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      При 500/сетевой ошибке /api/boxes UI показывает "Пока нет коробок"
      как будто это валидное пустое состояние.
      Пользователь получает ложную картину склада вместо явной ошибки загрузки.

      КАК ДОЛЖНО РАБОТАТЬ:
      При ошибке запроса показывать отдельный error-state и не маскировать сбой под пустые данные.

    code_example: |
      # client/src/pages/boxes.tsx
      const { data, isLoading } = useQuery<BoxesResponse>({ queryKey: ["/api/boxes"] });
      const boxes = Array.isArray(data?.boxes) ? data!.boxes : [];
      ...
      {isLoading ? "Загрузка..." : filtered.length === 0 ? "Пока нет коробок" : ...}

    found_count: 3
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-12T00:23:38+04:00
        agrees: true
        note: "Раунд 2: поверхностный проход по useQuery и веткам рендера"
      - agent: validator-frontend

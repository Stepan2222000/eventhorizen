improvements:
  - id: i-box-001
    file: py_backend/storage.py
    category: dead-code

    issue: |
      ЧТО НЕ ТАК:
      Метрика "overboxed" (когда в коробках числится больше, чем общий остаток) вычисляется и прокидывается в API/UI,
      но при текущей item-based модели (истина = inventory.items) она логически недостижима:
      boxedQty считается как subset totalQty, поэтому delta не может быть < 0.

      ПОЧЕМУ ЭТО ПЛОХО:
      - лишняя сложность (код и UI-ветки, которые никогда не активируются)
      - создаёт ложное чувство контроля (кажется, что система детектит расхождения, но на самом деле нет)

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Варианты:
      - удалить overboxed из backend/API/UI как недостижимый;
      - либо пересчитать "overboxed" как mismatch между items и movements (если это реально нужно как диагностика),
        с чётким определением "что считается истиной" и с тестами.

    code_example: |
      # py_backend/storage.py (getBoxes): overboxed_* считается через totals vs boxed,
      # где boxed ⊆ totals, поэтому unboxed_qty < 0 недостижимо.

    found_count: 1

  - id: e-box-20260212-004
    file: client/src/pages/box-details.tsx
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Черновик описания коробки синхронизируется только по зависимости box?.description.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      При переходе между двумя коробками с одинаковым description (часто null/"")
      useEffect не срабатывает, и в поле остаётся старый черновик от предыдущей коробки.
      Пользователь может сохранить описание не в ту коробку.

      КАК ДОЛЖНО РАБОТАТЬ:
      Сбрасывать черновик при смене самой коробки (например, по box?.name),
      а не только при изменении description-строки.

    code_example: |
      # client/src/pages/box-details.tsx
      useEffect(() => {
        if (!box) return;
        setDescriptionDraft(box.description || "");
      }, [box?.description]); // box?.name не участвует в зависимости

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-12T00:23:38+04:00
        agrees: true
        note: "Раунд 3: проверка состояния при навигации между коробками"

    fix: null

  - id: e-box-20260212-005
    file: py_backend/inventory_schema.py
    category: race-condition
    severity: critical

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      На startup backend всегда запускает ensure_inventory_schema(), где выполняется
      серия DDL/UPDATE/CREATE VIEW операций без общего межпроцессного lock.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      При одновременном старте двух процессов приложения (или при пересечении с другим
      процессом миграции) возникает deadlock в PostgreSQL. Один процесс падает на startup
      с DeadlockDetectedError, сервис не поднимается.

      КАК ДОЛЖНО РАБОТАТЬ:
      Инициализация схемы должна быть взаимоисключающей между процессами:
      advisory lock (pg_advisory_lock) вокруг bootstrap, либо отдельный миграционный процесс,
      либо идемпотентные шаги в фиксированном порядке под единым lock.

    code_example: |
      # py_backend/main.py
      # startup -> init_app_context -> ensure_inventory_schema(...)

      # py_backend/inventory_schema.py (фрагмент)
      await conn.execute("CREATE TABLE IF NOT EXISTS ...")
      ...
      await conn.execute(
        \"\"\"
        CREATE OR REPLACE VIEW inventory.box_contents AS
        SELECT ...
        \"\"\"
      )

      # Практически полученная ошибка:
      # asyncpg.exceptions.DeadlockDetectedError: deadlock detected
      # Process A waits AccessExclusiveLock ... blocked by Process B, and vice versa

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-12T00:46:42+04:00
        agrees: true
        note: "Практический запуск npm run dev:py завершился падением startup с DeadlockDetectedError"

    fix: null


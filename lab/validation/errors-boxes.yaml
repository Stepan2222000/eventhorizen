    issue: |
      ЧТО НЕ ТАК:
      "Инвентаризация" применяет корректировки как серию отдельных POST /api/movements (по одному на SMART).
      Если запрос N упадёт (конфликт остатков/сеть/валидация), первые N-1 уже применены, а остальное нет.

      ПОЧЕМУ ЭТО ПЛОХО:
      - пользователь ожидает атомарность "Применить корректировки", а получит частичное применение
      - тяжело откатывать вручную

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Сделать отдельный backend endpoint вида POST /api/boxes/:name/inventory-adjust,

errors:
  - id: e-box-001
    file: py_backend/storage.py
    category: state-corruption
    severity: critical

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      updateBox() проверяет "пустая ли коробка" ТОЛЬКО если в body пришло строгое boolean-значение `isActive === false`.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Если клиент (или баг на фронте) отправит `isActive: null` или `isActive: 0`,
      проверка "пустая ли коробка" будет пропущена, но коробка всё равно закроется из-за `bool(value) -> False`.
      В результате получится закрытая коробка с `in_stock` items внутри, что ломает инварианты item-системы:
      - BoxSelector скрывает закрытые коробки, и товар становится "заперт" (на складе есть, выбрать коробку нельзя).

      КАК ДОЛЖНО РАБОТАТЬ:
      Если поле `isActive` передано:
      - валидировать тип (строго bool), иначе 400;
      - при закрытии (isActive=false) всегда проверять, что коробка пуста.

    code_example: |
      # py_backend/storage.py (updateBox)
      if "isActive" in data and data.get("isActive") is False:
          not_empty = await self.inventoryPool.fetchrow(
              "SELECT 1 FROM inventory.box_contents WHERE box_number = $1 LIMIT 1",
              canonical,
          )
          if not_empty is not None:
              raise InvalidRequestError(f"Нельзя закрыть коробку {canonical}: в ней есть товар")

      ...
      if "isActive" in data:
          set_clauses.append(f"is_active = ${idx}")
          values.append(bool(data.get("isActive")))

      # Потенциально опасный запрос:
      # PATCH /api/boxes/K-4 { "isActive": null }  -> bool(null)=False, коробка закроется

      # Как исправить (идея):
      # value = data.get("isActive")
      # if not isinstance(value, bool): raise InvalidRequestError("isActive must be boolean")
      # if value is False: проверить пустоту
      # затем записать is_active = value

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-10T18:46:36+04:00
        agrees: true
        note: "Раунд 2 (поверхностный анализ)"

    fix: null

  - id: e-box-002
    file: py_backend/storage.py
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      POST /api/movements (через validateAndSanitizeForInsert) принимает отрицательные значения цен:
      - purchasePrice для purchase
      - salePrice и deliveryPrice для sale
      - purchasePrice (если задано) для adjust

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Это приводит к некорректным финансовым метрикам (прибыль/выручка/логистика) и "странным" значениям в UI.
      Ошибка реалистична: пользователь может случайно поставить минус (особенно при вводе с клавиатуры).
      Дополнительно: создание заказов (createOrder) уже строго валидирует non-negative цены,
      поэтому сейчас правила расходятся между "движениями" и "заказами".

      КАК ДОЛЖНО РАБОТАТЬ:
      Для purchase/sale/delivery/return_price требовать non-negative.
      Для adjust unit price: либо тоже non-negative, либо явно задокументировать поддержку отрицательных значений.

    code_example: |
      # py_backend/storage.py (validateAndSanitizeForInsert)
      if reason == "purchase":
          requireNumberString(purchase_price, "Цена закупки")  # допускает "-100"
      if reason == "sale":
          requireNumberString(sale_price, "Цена продажи")      # допускает "-100"
          requireNumberString(delivery_price, "Стоимость доставки")  # допускает "-100"

      # Как исправить:
      # - заменить requireNumberString(...) на requireNonNegativeNumberString(...)
      # - синхронизировать frontend-валидацию в client/src/pages/add-movement.tsx

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-10T18:46:36+04:00
        agrees: true
        note: "Раунд 2 (поверхностный анализ)"

    fix: null

  - id: e-box-003
    file: py_backend/storage.py
    category: race-condition
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      createBox() делает read-then-insert:
      1) SELECT по name_norm
      2) INSERT в inventory.boxes

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      При двойном клике/двух вкладках/повторе запроса возможна гонка:
      оба запроса пройдут SELECT, затем один INSERT упадет с unique violation (name_norm).
      Этот asyncpg-эксепшн не преобразуется в InvalidRequestError, поэтому API может вернуть 500 вместо 400.

      КАК ДОЛЖНО РАБОТАТЬ:
      Обрабатывать уникальность атомарно:
      - INSERT ... ON CONFLICT (name_norm) DO NOTHING/UPDATE + SELECT результата
      или
      - ловить sqlstate 23505 и превращать в InvalidRequestError("Коробка уже существует: ...")

    code_example: |
      # py_backend/storage.py (createBox)
      existing = await self.inventoryPool.fetchrow(
          "SELECT name FROM inventory.boxes WHERE name_norm = $1 LIMIT 1",
          norm,
      )
      if existing is not None:
          raise InvalidRequestError(...)

      row = await self.inventoryPool.fetchrow(
          "INSERT INTO inventory.boxes (...) VALUES (...) RETURNING ...",
          ...
      )

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-10T18:46:36+04:00
        agrees: true
        note: "Раунд 2 (поверхностный анализ)"

    fix: null

  - id: e-box-004
    file: py_backend/storage.py
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Для количественных полей, которые по смыслу должны быть целыми (qty, qtyDelta, qty в заказе/перемещении),
      местами используется toInt(), которая просто TRUNC-ит float и строки (например "1.9" -> 1).

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Если фронт/клиент отправит дробное количество (что легко сделать в <input type="number">),
      сервер "молча" округлит вниз и выполнит операцию с другим количеством, чем ожидал пользователь.
      Это не падает ошибкой, но приводит к неожиданному поведению и потенциальным спорным данным (особенно для transfer).

      КАК ДОЛЖНО РАБОТАТЬ:
      Для qty/qtyDelta, где количество экземпляров, валидировать строго:
      - число finite
      - целое (is_integer)
      - > 0 (или < 0 по смыслу)
      и возвращать 400 при дробных значениях.
      Параллельно: на фронте выставить step=1 и парсить через parseInt/Math.trunc.

    code_example: |
      # py_backend/storage.py
      def toInt(value: Any) -> int:
          ...
          return math.trunc(n)   # 1.9 -> 1

      # transferBetweenBoxesAttempt:
      qty = toInt(data.get("qty"))   # дробь будет усечена

      # createOrder / createOrderReturn:
      qty = toInt(item_dict.get("qty"))  # дробь будет усечена

      # Пример: фронт отправил qty=1.5 -> сервер выполнит qty=1 без явной ошибки.

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-10T18:55:06+04:00
        agrees: true
        note: "Раунд 3 (глубокий анализ)"

    fix: null

  - id: e-box-005
    file: py_backend/storage.py
    category: race-condition
    severity: critical

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      updateBox() выполняет проверку "коробка пустая" и UPDATE is_active без явной транзакции SERIALIZABLE и без блокировок.
      Это две независимые операции в Read Committed.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Возможна гонка с параллельной операцией, которая кладёт items в коробку (purchase/adjust(+)/return/transfer-to):
      1) updateBox видит, что коробка пустая
      2) другая транзакция вставляет items в эту коробку
      3) updateBox закрывает коробку

      Итог: закрытая коробка содержит `in_stock` items. Это ломает инварианты item-системы
      (закрытая коробка не должна содержать items на складе) и может "запереть" товар, т.к. селекторы скрывают закрытые коробки.

      КАК ДОЛЖНО РАБОТАТЬ:
      Закрытие коробки должно быть атомарным относительно операций с items:
      - выполнить updateBox в SERIALIZABLE транзакции
      - (желательно) залочить строку коробки (SELECT ... FOR UPDATE)
      - проверку пустоты делать внутри той же транзакции
      - дополнительно рассмотреть DB-level enforcement (trigger на items insert/update, запрещающий box_number в закрытую коробку)

    code_example: |
      # py_backend/storage.py (updateBox) - нет явного BEGIN/COMMIT.
      not_empty = await self.inventoryPool.fetchrow(
          "SELECT 1 FROM inventory.box_contents WHERE box_number = $1 LIMIT 1",
          canonical,
      )
      ...
      updated = await self.inventoryPool.fetchrow(
          "UPDATE inventory.boxes SET is_active = ...",
          ...
      )

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-10T18:55:06+04:00
        agrees: true
        note: "Раунд 3 (глубокий анализ)"

    fix: null

  - id: e-box-006
    file: py_backend/inventory_schema.py
    category: edge-case
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      При инициализации схемы boxes реестр заполняется из исторических movements.box_number (seed boxes from movements).
      Исторически box_number был "свободным текстом", поэтому в данных могут встретиться имена коробок с символом '/'.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      В runtime API/валидации коробок '/' запрещён (requireBoxName), а UI/роуты используют коробку в path (/boxes/:name).
      Если в базе появится коробка с '/', она станет проблемной:
      - её может быть невозможно открыть в UI (404 на /api/boxes/{name} из-за requireBoxName)
      - её может быть невозможно использовать в операциях (purchase/transfer/...) из-за requireBoxName

      КАК ДОЛЖНО РАБОТАТЬ:
      Во время seed/migration нужно гарантировать, что canonical name коробки соответствует runtime-валидации.
      Например:
      - при выборе canonical варианта предпочитать варианты без '/'
      - либо санитизировать: заменить '/' на '-' (или другой безопасный символ) перед INSERT в boxes и canonicalize movements.

    code_example: |
      # py_backend/storage.py
      def requireBoxName(value: Any, field: str) -> str:
          ...
          if "/" in name:
              raise InvalidRequestError(f"{field} не должен содержать символ '/'")

      # py_backend/inventory_schema.py (seed boxes from historical movements)
      movement_box_rows = await conn.fetch(
          \"\"\"
          SELECT box_number, COUNT(*)::bigint AS cnt
          FROM inventory.movements
          WHERE box_number IS NOT NULL
            AND LENGTH(TRIM(box_number)) > 0
          GROUP BY box_number
          \"\"\"
      )
      # далее canonical выбирается из raw box_number без фильтрации по '/'

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-10T18:57:21+04:00
        agrees: true
        note: "Раунд 3 (глубокий анализ)"

    fix: null


  - id: e-9b113e
    file: py_backend/routes.py
    category: edge-case
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Для CSV после парсинга не проверяется случай "есть только заголовки и нет data-rows".
      Сервер возвращает 200 с результатом totalRows=0/imported=0/errors=0.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Пользователь получает тихий no-op без явной ошибки, думая, что импорт прошёл.
      При этом для аналогичного XLSX (только заголовки) сервер корректно даёт
      ошибку "Empty Excel sheet" (400). Поведение форматов расходится.

      КАК ДОЛЖНО РАБОТАТЬ:
      CSV и XLSX должны одинаково валидировать отсутствие data-rows:
      возвращать 400 с понятной причиной.

    code_example: |
      # CSV ветка (py_backend/routes.py:1243-1252):
      # raw_objects может остаться пустым, но check отсутствует
      rows = parse_bulk_import_rows_from_objects(raw_objects)

      # XLSX ветка (py_backend/routes.py:1233-1234):
      if len(raw_rows) == 0:
          return JSONResponse(status_code=400, content={"error": "Empty Excel sheet"})

      # Подтверждение e2e:
      # - header-only.csv -> Результаты 0/0/0 (200)
      # - header-only.xlsx -> Ошибка импорта {"error":"Empty Excel sheet"}

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:37:40Z
        agrees: true
        note: "Подтверждено практическими прогонами в agent-browser."

    fix: null

  - id: e-a12f40
    file: client/src/pages/bulk-import.tsx
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      При !response.ok клиент бросает Error(await response.text()).
      Если backend возвращает JSON-ошибку, в UI показывается сырая JSON-строка.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      В toast пользователь видит технический текст вида
      {"error":"Empty Excel sheet"} или {"error":"Failed to process bulk import"}
      вместо нормального сообщения.

      КАК ДОЛЖНО РАБОТАТЬ:
      Клиент должен парсить JSON-ошибку и показывать человеко-понятный message
      (поле error), с fallback на text только при непарсируемом ответе.

    code_example: |
      # Проблемный код (client/src/pages/bulk-import.tsx:30-32):
      if (!response.ok) {
        throw new Error(await response.text());
      }

      # Подтверждение e2e:
      # - header-only.xlsx -> toast: {"error":"Empty Excel sheet"}
      # - cp1251.csv -> toast: {"error":"Failed to process bulk import"}

    found_count: 1

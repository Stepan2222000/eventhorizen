    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Весь bulk_import() обёрнут в общий except с ответом 500
      "Failed to process bulk import".

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Ожидаемые пользовательские ошибки (неверная кодировка CSV, битый XLSX,
      ошибки парсинга данных) превращаются в 500 без диагностической причины.
      Пользователь не понимает, как исправить файл.

      КАК ДОЛЖНО РАБОТАТЬ:
      Для предсказуемых ошибок парсинга/валидации нужен 400 с понятным message.
      500 оставлять только для серверных сбоев.

    code_example: |
      # Проблемный код (py_backend/routes.py:1268-1269):
      except Exception:
          return JSONResponse(status_code=500, content={"error": "Failed to process bulk import"})

      # Как исправить:
      # - ловить UnicodeDecodeError / ValueError / xlrd/openpyxl exceptions отдельно -> 400

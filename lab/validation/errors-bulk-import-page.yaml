errors:
  - id: e-1f9c01
    file: py_backend/routes.py
    category: logic-error
    severity: critical

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      В parse_csv_text() ветка для '\r\n' просто пропускает оба символа
      без push_field()/push_row().

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      CSV из Excel/Windows обычно использует CRLF. В этом случае все строки
      склеиваются в одну, заголовки ломаются, импорт даёт массовые ошибки.

      КАК ДОЛЖНО РАБОТАТЬ:
      И '\n', и '\r\n' должны завершать текущую строку одинаково
      (push_field + push_row).

    code_example: |
      # Проблемный код (py_backend/routes.py:117-125):
      if ch == "\r":
          nxt = text[i + 1] if i + 1 < len(text) else None
          if nxt == "\n":
              i += 1
          else:
              push_field()
              push_row()
          i += 1
          continue

      # Воспроизведение:
      parse_csv_text("smart,qty_delta,reason\r\nsmart_1,1,purchase\r\n")
      # Фактически: одна склеенная строка

      # Как исправить:
      if ch == "\r":
          push_field()
          push_row()
          if i + 1 < len(text) and text[i + 1] == "\n":
              i += 1
          i += 1
          continue

    found_count: 2
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:18:30Z
        agrees: true
        note: "Подтверждено запуском parse_csv_text() на CRLF-входе."
      - agent: validator-1
        timestamp: 2026-02-11T20:33:10Z
        agrees: true
        note: "Подтверждено e2e: valid-crlf.csv через agent-browser дал Результаты 0/0/0 вместо импорта 1 строки."

    fix: null

  - id: e-2a44b0
    file: py_backend/routes.py
    category: edge-case
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      CSV всегда декодируется как UTF-8, а заголовки просто trim() без
      удаления BOM.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      CSV с UTF-8 BOM (частый экспорт) даёт заголовок '\ufeffsmart' вместо smart.
      Маппинг не находит поле smart, и каждая строка падает с ошибкой
      про обязательный SMART код.

      КАК ДОЛЖНО РАБОТАТЬ:
      BOM должен удаляться до маппинга (например, decode('utf-8-sig')
      или нормализация первого заголовка).

    code_example: |
      # Проблемный код (py_backend/routes.py:1237,1242):
      csv_text = content.decode("utf-8")
      headers = [h.strip() for h in table[0]]

      # Воспроизведение:
      headers = ["\ufeffsmart", "qty_delta", "reason"]
      # parse_bulk_import_rows_from_objects -> smart = ""

      # Как исправить:
      csv_text = content.decode("utf-8-sig")
      # либо headers[0] = headers[0].lstrip("\ufeff")

    found_count: 2
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:19:10Z
        agrees: true
        note: "Подтверждено локальным вызовом parse_bulk_import_rows_from_objects."
      - agent: validator-1
        timestamp: 2026-02-11T20:33:20Z
        agrees: true
        note: "Подтверждено e2e: valid-bom.csv через agent-browser -> 'Строка 2: SMART код обязательно'."

    fix: null

  - id: e-3b8812
    file: py_backend/routes.py
    category: spec-mismatch
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      parse_bulk_import_rows_from_objects() проверяет только фиксированные
      варианты ключей ("smart", "SMART", "qty_delta", "qtyDelta", ...).

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      В документации заявлен case-insensitive маппинг. Заголовки вида
      "Smart"/"QTY_DELTA"/"Reason" не попадут в маппинг и дадут ошибки
      валидации или нулевые значения.

      КАК ДОЛЖНО РАБОТАТЬ:
      Перед маппингом ключи нужно нормализовать к нижнему регистру.

    code_example: |
      # Проблемный код (py_backend/routes.py:222-225):
      smart = pick_row_value(obj, ["smart", "SMART"])
      qty_delta = pick_row_value(obj, ["qty_delta", "qtyDelta", "qty"])

      # Спецификация (lab/data-structure.md:1216):
      # "Входные ключи (case-insensitive)"

      # Как исправить:
      normalized = {str(k).lower(): v for k, v in obj.items()}
      smart = normalized.get("smart")

    found_count: 2
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:20:00Z
        agrees: true
        note: "Несоответствие между docs и реализацией."
      - agent: validator-1
        timestamp: 2026-02-11T20:33:30Z
        agrees: true
        note: "Подтверждено e2e: mixed-case-headers.csv -> SMART пустой, qtyDelta=0, reason пустой."

    fix: null

  - id: e-4f190a

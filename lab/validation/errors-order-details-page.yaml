errors:
  - id: e-order-details-001
    file: py_backend/storage.py
    category: spec-mismatch
    severity: critical

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      При создании глубокой отгрузки с методом "Самовывоз" сервер всё равно
      создаёт shipment со статусом `pending`.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Самовывозные заказы зависают в "ожидает отправки", их можно ошибочно
      переводить по логистическим статусам как обычную доставку.

      КАК ДОЛЖНО РАБОТАТЬ:
      По спецификации `lab/orders-system.md` самовывоз должен сразу иметь
      статус `delivered` ("получено"), без этапа pending.

    code_example: |
      # Практика (agent-browser, order #14):
      # Созданы shipment #22 и #23 методом "Самовывоз"
      # и в UI/API оба со статусом "Ожидает".
      # Screenshot: lab/validation/agent-browser-order14-pickup-shipments-pending.png

      # Код сервера:
      # py_backend/storage.py:3460
      # VALUES (..., 'pending', NOW(), NOW())

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:43:09Z
        agrees: true
        note: "Подтверждено практическим созданием самовывозных отгрузок через UI."
    fix: null

  - id: e-order-details-002
    file: client/src/pages/order-details.tsx
    category: spec-mismatch
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      В форме "Добавить отгрузку" поле трек-номера всегда видно, даже когда
      выбран метод "Самовывоз".

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Пользователь вводит нерелевантный трек для самовывоза, форма вводит
      в заблуждение и расходится с согласованной UX-логикой.

      КАК ДОЛЖНО РАБОТАТЬ:
      Для самовывоза поле трек-номера должно скрываться или быть disabled.

    code_example: |
      # Практика:
      # order #14, выбран "Самовывоз", поле "Трек-номер" остаётся активным.
      # Screenshots:
      # - lab/validation/agent-browser-order14-pickup-shipments-pending.png
      # - lab/validation/agent-browser-order14-create-shipment-stuck.png

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:43:09Z
        agrees: true
        note: "Подтверждено в e2e при выборе метода доставки."
    fix: null

  - id: e-order-details-003
    file: py_backend/storage.py
    category: state-corruption
    severity: critical

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Возврат увеличивает `returnedQty` и переводит экземпляры в `in_stock`,
      но не корректирует `shipment_items` pending-отгрузок.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Возникает рассинхрон: часть товара уже возвращена на склад, но в pending
      по-прежнему числится к отправке. Это искажает операционный статус заказа
      и позволяет ошибочные действия с отгрузками.

      КАК ДОЛЖНО РАБОТАТЬ:
      При возврате по неотгруженным позициям pending-распределение shipment_items
      должно уменьшаться (или блокировать такой return без корректной переразбивки).

    code_example: |
      # Практика (order #14 после return):
      # qty=12, returnedQty=1, но pending_sum по shipment_items остаётся 12.
      # Screenshot: lab/validation/agent-browser-order14-after-return-pending-still-12.png
      # API check:
      # { "item_qty": 12, "returned_qty": 1, "pending_sum": 12 }

      # Смежный симптом (order #13):
      # pending shipment остался, но переразбивка падает:
      # "Недостаточно проданных экземпляров для переразделения отгрузки..."

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:43:09Z
        agrees: true
        note: "Подтверждено UI + API после практического возврата."
    fix: null

  - id: e-order-details-004
    file: py_backend/storage.py
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Обычный `kind=return` разрешён даже когда позиция ещё не отгружена
      (`shippedQty=0`, только pending-отгрузки).

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Смешиваются две разные бизнес-операции: фактический возврат от клиента
      и внутренняя корректировка по неотгруженному товару.

      КАК ДОЛЖНО РАБОТАТЬ:
      Для неотгруженных позиций должна использоваться `correction`, а `return`
      должен быть ограничен отгруженными/полученными товарами.

    code_example: |
      # Практика:
      # order #14, при shippedQty=0 создан "Возврат #11" с kind=return.
      # Note: "agent-browser return on pending"
      # UI доказательство: История возвратов на /orders/14.

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:43:09Z
        agrees: true
        note: "Подтверждено практическим созданием возврата на pending-заказе."
    fix: null

  - id: e-order-details-005
    file: py_backend/routes.py
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      PATCH `/api/shipments/{id}/status` принимает любой статус из enum без
      проверки допустимого перехода.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Статус можно откатывать назад (например delivered -> pending), что ломает
      жизненный цикл отправки и управленческую отчётность.

      КАК ДОЛЖНО РАБОТАТЬ:
      Нужны правила переходов по FSM (минимум запрет назад без спец-права).

    code_example: |
      # Практика:
      # shipment #13 успешно переведён PATCH:
      # delivered -> pending (HTTP 200).
      #
      # routes.py:497-500 проверяет только принадлежность к enum,
      # но не валидирует переход.

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:43:09Z
        agrees: true
        note: "Подтверждено прямым API-вызовом."
    fix: null

  - id: e-order-details-006
    file: py_backend/storage.py
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      После мутаций (создание отгрузки/возврата) сервер делает тяжёлый
      post-commit `getOrderById`, из-за чего ответ может идти десятки секунд.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      На фронте кнопки надолго зависают в "Создание.../Оформление...",
      пользователь может считать действие "зависшим" и повторять операции.

      КАК ДОЛЖНО РАБОТАТЬ:
      Отдавать быстрый ответ (минимальный payload) и обновлять детали заказа
      отдельным refetch, либо оптимизировать сборку OrderDetails.

    code_example: |
      # Практика:
      # - "Создать отгрузку" на #14: длительный stuck-стейт.
      #   Screenshot: lab/validation/agent-browser-order14-create-shipment-stuck.png
      # - "Оформить возврат" на #14: длительный stuck-стейт.
      #   Screenshot: lab/validation/agent-browser-order14-return-stuck.png
      #
      # storage.py:
      # - createAdditionalShipmentAttempt(): COMMIT -> getOrderById() (3563-3568)
      # - createOrderReturnAttempt(): COMMIT -> getOrderById() (3842-3847)

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:43:09Z
        agrees: true
        note: "Подтверждено e2e: длительные мутации при уже применённых изменениях."
    fix: null

  - id: e-order-details-007
    file: py_backend/storage.py
    category: spec-mismatch
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Для нулевой стоимости доставки остаётся `deliveryPayer` (например `buyer`)
      в карточке отправки.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      UI показывает противоречивую бизнес-семантику ("0.00 ₽, платит buyer"),
      усложняется аналитика логистики и интерпретация данных.

      КАК ДОЛЖНО РАБОТАТЬ:
      При deliveryPrice=0 поле payer должно быть null/скрыто по всему контуру.

    code_example: |
      # Практика:
      # order #13 и #14, shipment #13/#14:
      # "Стоимость: 0.00 ₽ · Платит: buyer".
      #
      # createAdditionalShipmentAttempt() обнуляет payer только для pickup+0,
      # но не для других методов с нулевой стоимостью.

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:43:09Z
        agrees: true
        note: "Подтверждено в UI и API данных заказов."
    fix: null


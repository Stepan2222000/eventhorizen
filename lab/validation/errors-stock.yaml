    issue: |
      ЧТО НЕ ТАК:
      В `getBoxes()` считается блок `overboxed` (позиции с `unboxed_qty < 0`), но при текущей формуле
      `unboxed_qty = total_qty - boxed_qty` это значение не может стать отрицательным, потому что `boxed_qty`
      считается как подмножество `total_qty` (оба COUNT по одной таблице `inventory.items`).

      ПОЧЕМУ ЭТО ПЛОХО:
      - Лишняя сложность запроса и ответа API
      - Создает ощущение, что "overboxed" реально возможен и его нужно мониторить (а он всегда будет 0)

      КАК СДЕЛАТЬ ЛУЧШЕ:
      - Удалить `overboxed_*` из SQL и payload
      - Либо поменять расчет так, чтобы "overboxed" действительно означал реальную аномалию (если есть такой кейс)

    code_example: |

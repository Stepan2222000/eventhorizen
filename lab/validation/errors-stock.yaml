errors:
  - id: e-stock-0001
    file: py_backend/storage.py
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Валидация цен в `validateAndSanitizeForInsert()` для purchase/sale допускает отрицательные значения,
      потому что используется `requireNumberString()` (проверяет "число", но не ">= 0").

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      1) Если в БД уже включены CHECK-constraints `*_non_negative_chk`, вставка упадет на уровне БД
         и клиент получит 500 с неочевидным текстом ошибки.
      2) Если constraints еще не созданы/не применяются (старые инсталляции), отрицательные цены
         попадут в `inventory.movements` и сломают аналитику (прибыль/маржа).

      КАК ДОЛЖНО РАБОТАТЬ:
      На уровне API/валидатора вернуть 400 с понятным сообщением и не допускать отрицательные значения
      для `purchasePrice`, `salePrice`, `deliveryPrice` (разрешая 0).

    code_example: |
      # Проблемный код (sale/purchase):
      # requireNumberString(purchase_price, "Цена закупки")
      # requireNumberString(sale_price, "Цена продажи")
      # requireNumberString(delivery_price, "Стоимость доставки")

      # Как исправить:
      # requireNonNegativeNumberString(purchase_price, "Цена закупки")
      # requireNonNegativeNumberString(sale_price, "Цена продажи")
      # requireNonNegativeNumberString(delivery_price, "Стоимость доставки")

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:33:13Z
        agrees: true
        note: "Раунд 2: поверхностный анализ"
    fix: null

  - id: e-stock-0002
    file: py_backend/storage.py
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      При создании продажи через `/api/movements` поле `shippingMethodId` проверяется только на то,
      что это "число" (int/float), но не проверяется:
      - что значение целое
      - что такой способ доставки реально существует в `inventory.shipping_methods`
      - что `shippingMethodId` корректно сочетается с `trackNumber` (например, самовывоз)

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      В `inventory.movements.shipping_method_id` могут появиться несуществующие id.
      Это приводит к "битым" данным и странному UI (не находится способ доставки, неверные фильтры/отображение).

      КАК ДОЛЖНО РАБОТАТЬ:
      Валидировать `shippingMethodId` как целое > 0 и проверять существование записи в
      `inventory.shipping_methods` до вставки движения (аналогично `createOrder()`).

    code_example: |
      # Проблемный фрагмент:
      # is_shipping_number = isinstance(shipping_method_id, (int, float)) and ...
      # ... movement["shippingMethodId"] = shipping_method_id

      # Как исправить (идея):
      # mid = toInt(shipping_method_id)
      # if mid <= 0: raise InvalidRequestError("Способ доставки обязателен")
      # row = await client.fetchrow("SELECT 1 FROM inventory.shipping_methods WHERE id=$1", mid)
      # if row is None: raise InvalidRequestError("Способ доставки не найден")

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:33:13Z
        agrees: true
        note: "Раунд 2: поверхностный анализ"
    fix: null

  - id: e-stock-0003
    file: py_backend/storage.py
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Часть операций выполняется в `SERIALIZABLE` транзакциях без retry-цикла.
      Примеры: `createOrder()`, `createOrderReturn()`, `updateMovement()`.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      При конкурентных изменениях (параллельные продажи/перемещения/возвраты по тем же SMART/коробкам)
      PostgreSQL может выбросить `SQLSTATE 40001` (serialization failure).
      Сейчас это превращается в 500 и пользователь видит "ошибку сервера", хотя корректное поведение
      в этом случае: повторить транзакцию 2-3 раза с backoff (как уже сделано в `createMovement()` и `transferBetweenBoxes()`).

      КАК ДОЛЖНО РАБОТАТЬ:
      Все write-операции на inventory (особенно влияющие на остатки) должны иметь единый retry-механизм
      для 40001: `max_retries`, exponential backoff, и понятное сообщение при исчерпании попыток.

    code_example: |
      # Есть retry:
      # async def createMovement(...):
      #   for attempt in range(max_retries):
      #     try: return await self.createMovementAttempt(...)
      #     except Exception as err:
      #       if isSerializationError(err): sleep+retry

      # Нет retry (примеры):
      # async def createOrder(...): BEGIN SERIALIZABLE ... COMMIT
      # async def createOrderReturn(...): BEGIN SERIALIZABLE ... COMMIT
      # async def updateMovement(...): BEGIN SERIALIZABLE ... COMMIT

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:33:13Z
        agrees: true
        note: "Раунд 3: глубокий анализ (транзакции без retry)"
    fix: null

  - id: e-stock-0004
    file: py_backend/storage.py
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      В ряде write-операций количество приводится через `toInt()` (т.е. через float->trunc),
      без явной проверки, что вход был целым числом.
      Примеры: `transferBetweenBoxesAttempt()` (qty), `createOrder()` (qty), `createOrderReturn()` (qty).

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Если клиент (или интеграция) пришлет `qty = 1.9`, сервер молча обработает это как 1.
      Это приводит к "тихой" потере точности и неожиданным остаткам, которые трудно отследить.

      КАК ДОЛЖНО РАБОТАТЬ:
      Для qty/qtyDelta в складских операциях нужно требовать целое число и возвращать 400 при дробном вводе.
      (Как уже сделано для `qtyDelta` в `validateAndSanitizeForInsert()`.)

    code_example: |
      # Проблемные места (идея):
      # qty = toInt(data.get("qty"))
      # qty = toInt(item_dict.get("qty"))

      # Как исправить:
      # - либо принимать только int
      # - либо принимать string/number, но проверять `.is_integer()` до int()

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:33:13Z
        agrees: true
        note: "Раунд 3: глубокий анализ (qty truncation)"
    fix: null

  - id: e-stock-0005
    file: py_backend/inventory_schema.py
    category: state-corruption
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Инварианты для `inventory.items` (допустимые `state` и правило "если state=in_stock, то box_number обязателен")
      заданы только в `CREATE TABLE IF NOT EXISTS inventory.items (...)`.
      Если таблица `inventory.items` уже существовала без этих CHECK-constraints, `ensure_inventory_schema()` их не добавит.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      - В БД могут продолжать жить "битые" items (например, `state='in_stock'` и `box_number IS NULL` или пустой),
        из-за чего API начинает отдавать противоречивые данные:
        `inventory.stock` считает такие items, а `inventory.box_contents` их может не учитывать.
      - Логика, завязанная на "коробка не может быть закрыта, если в ней есть товар", опирается на `box_contents`
        и может давать неправильный результат при неконсистентных box_number.

      КАК ДОЛЖНО РАБОТАТЬ:
      `ensure_inventory_schema()` должна гарантировать наличие этих CHECK-constraints для существующих БД
      (например, добавлять их через `ALTER TABLE ... ADD CONSTRAINT ... NOT VALID`, как сделано для non-negative цен),
      а затем отдельной процедурой/командой валидировать после очистки данных.

    code_example: |
      # Сейчас constraints есть только в CREATE TABLE IF NOT EXISTS.
      # Для существующих инсталляций можно добавить DO-блок:
      # - items_state_chk
      # - items_in_stock_box_chk
      # (оба NOT VALID)

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:33:13Z
        agrees: true
        note: "Раунд 3: глубокий анализ (инварианты items не гарантируются для legacy)"
    fix: null


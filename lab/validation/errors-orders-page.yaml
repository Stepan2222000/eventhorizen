  - id: i-ord-003
    file: client/src/pages/sold-items.tsx
    category: dry-violation

    issue: |
      ЧТО НЕ ТАК:
      - Логика инвалидации кэшей дублируется минимум в двух местах:
        - `/orders` → `invalidateAfterOrderChanges()`
        - `/orders/:id` → `invalidateRelated()`
      - Из-за дублирования уже появился рассинхрон (см. ошибки про `/api/orders?includeArchived=1` и `/api/items`).

      ПОЧЕМУ ЭТО ПЛОХО:
      - Любая новая сущность для сброса (или изменение queryKey) требует синхронных правок в нескольких файлах.
      - Легко допустить "тихие" баги со staleTime=Infinity.

      КАК СДЕЛАТЬ ЛУЧШЕ:
      - Вынести общую функцию инвалидации (например `invalidateOrdersFeature(queryClient, opts)`),
        и вызывать её из обоих экранов.
      - Добавить в неё `/api/items` и predicate для `/api/orders*`.

    code_example: |
      # Пример идеи:
      # export function invalidateOrdersFeature(qc: QueryClient, orderId?: number) { ... }


    fix: null

  - id: e-orders-008
    file: py_backend/storage.py
    category: state-corruption
    severity: critical

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      API обновления статуса отправки принимает любое значение из
      `pending|shipped|delivered` без проверки допустимого перехода.
      В `updateShipmentStatus()` статус просто перезаписывается.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Можно откатывать доставленный заказ назад (например,
      `delivered -> shipped -> pending`). Это приводит к регрессии
      бизнес-состояния и переписывает `sale_status` у движений продажи,
      ломая достоверность аналитики и операционного статуса.

      КАК ДОЛЖНО РАБОТАТЬ:
      Разрешать только монотонные переходы (обычно `pending -> shipped -> delivered`)
      и запрещать rollback с явной ошибкой 400.

    code_example: |
      # routes.py
      if status not in ("pending", "shipped", "delivered"):
          return 400
      shipment = await storage.updateShipmentStatus(sid, status)

      # storage.py
      UPDATE inventory.shipments
      SET status = $1, updated_at = NOW()
      WHERE id = $2

      # Как исправить:
      # 1) проверить текущий статус перед UPDATE
      # 2) отклонять обратные переходы (rollback)
      # 3) логировать попытки недопустимых переходов

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:44:54Z
        agrees: true
        note: |
          Практический прогон через agent-browser на /orders/16:
          сначала перевёл pending -> delivered, затем delivered -> shipped,
          затем shipped -> pending. Все переходы были приняты и сохранены.
          Скрин после отката: lab/validation/agent-browser/order-16-status-regression-pending.png
    fix: null

  - id: e-orders-009
    file: client/src/pages/order-details.tsx
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Кнопка "Оформить возврат" активна даже когда выбрано 0 экземпляров.
      Нажатие отправляет мутацию и падает с клиентской ошибкой
      "Укажите количество хотя бы для одной позиции".

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Пользователь регулярно получает лишние destructive-тосты и делает
      бесполезные запросы. Это создаёт шум, ухудшает UX и маскирует
      действительно важные ошибки в форме.

      КАК ДОЛЖНО РАБОТАТЬ:
      Пока `totalReturnQty === 0`, кнопка должна быть disabled
      (или submit должен быть заблокирован до выбора позиций).

    code_example: |
      # UI:
      <Button
        onClick={() => createReturnMutation.mutate()}
        disabled={createReturnMutation.isPending}
      >
        Оформить возврат
      </Button>

      # mutation:
      if (items.length === 0) {
        throw new Error("Укажите количество хотя бы для одной позиции");
      }

      # Как исправить:
      # disabled={createReturnMutation.isPending || totalReturnQty === 0}

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:44:54Z
        agrees: true
        note: "Практический прогон через agent-browser: клик по кнопке при 0 выбранных дал expected error-toast и лишний submit."
    fix: null


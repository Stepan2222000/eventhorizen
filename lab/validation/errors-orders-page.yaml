  - id: e-orders-003
    file: client/src/components/item-picker-dialog.tsx
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Строка выбора экземпляра сделана как `<button>`, и внутри неё рендерится
      `Checkbox`, который в shadcn/radix тоже рендерится как `<button>`.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Получается вложенный `<button>` внутри `<button>` (невалидная HTML-структура).
      Это создаёт нестабильное поведение кликов/клавиатуры между браузерами и
      ухудшает доступность (фокус/активация элементов).

      КАК ДОЛЖНО РАБОТАТЬ:
      Нельзя вкладывать кнопку в кнопку. Внешний контейнер должен быть `div`
      (или `label`) с обработчиком, либо внутренний control должен быть не-button.

    code_example: |
      # Проблемный код:
      <button ... onClick={() => toggle(item)}>
        <Checkbox
          checked={checked}
          onCheckedChange={() => toggle(item)}
          onClick={(e) => e.stopPropagation()}
        />
      </button>

      # Как исправить:
      # 1) Сделать outer row через <div role="button"> + keyboard handler,
      # или
      # 2) Оставить один интерактивный control без nested <button>.

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:22:32Z
        agrees: true
        note: "Раунд 2/5: подтверждено по структуре item-picker + ui/checkbox."
    fix: null

  - id: e-orders-004
    file: py_backend/storage.py
    category: edge-case
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      В `getItems()` при несуществующей коробке возвращается специальный ответ
      с `limit: 0` и `offset: 0`, независимо от входных параметров.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      API отвечает с формально валидной, но несогласованной пагинацией:
      клиент получает shape, отличающийся от обычного контракта endpoint-а.
      Это легко ломает универсальные UI-компоненты пагинации и диагностику.

      КАК ДОЛЖНО РАБОТАТЬ:
      Даже при пустом результате контракт пагинации должен сохраняться:
      возвращать запрошенные `limit` и `offset`.

    code_example: |
      # Проблемный код:
      if resolved is None:
          return {"items": [], "total": 0, "limit": 0, "offset": 0}

      # Как исправить:
      # Вернуть {"items": [], "total": 0, "limit": limit, "offset": offset}
      # после вычисления limit/offset, либо вычислить их до branch.

    found_count: 2
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:22:32Z
        agrees: true
        note: "Раунд 3: проверка edge-case API-контракта /api/items."
      - agent: validator-backend
        timestamp: 2026-02-11T20:22:32Z
        agrees: true
        note: "Параллельный backend-аудит подтвердил проблему контракта пагинации."
    fix: null

  - id: e-orders-005
    file: client/src/components/smart-search.tsx
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      После ввода в SmartSearch запрос выполняется асинхронно (debounce + fetch).
      Если пользователь успевает увести фокус (клик в другое поле), поповер закрывается.
      Но когда ответ API приходит, код безусловно делает `setIsOpen(data.length > 0)`.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Список результатов самопроизвольно открывается повторно, хотя пользователь
      уже переключился на другое поле формы (воспроизводится стабильно на медленной сети).
      Это ломает UX и мешает вводу в соседние поля.

      КАК ДОЛЖНО РАБОТАТЬ:
      Поповер не должен переоткрываться после потери фокуса. Открывать результаты
      только если текущий запрос всё ещё актуален и фокус остаётся в поисковом поле.

    code_example: |
      # Проблемный код:
      const data = (await res.json()) as ArticleSearchResult[];
      setResults(data);
      setIsOpen(data.length > 0);

      # Как исправить:
      # Проверять актуальность запроса и фокус перед открытием:
      # if (inputRef.current === document.activeElement && latestQueryRef.current === q) {
      #   setIsOpen(data.length > 0);
      # }

    found_count: 1
    rejected_count: 0
    findings:

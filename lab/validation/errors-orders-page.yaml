      ПОЧЕМУ ЭТО ПЛОХО:
      - Контракт между фронтом и бэком становится неявным.
      - Любой другой клиент (или будущий рефактор фронта) может начать посылать payload,
        который валиден по shared schema, но будет стабильно падать на API.

      КАК СДЕЛАТЬ ЛУЧШЕ:
      - Добавить `superRefine` в `shipmentInputSchema`: если `Number(deliveryPrice) > 0`, то `deliveryPayer` обязателен.


errors:
  - id: e-orders-001
    file: client/src/pages/sold-items.tsx
    category: spec-mismatch
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Выбор клиента в форме заказа реализован обычным Select без поиска:
      пользователь видит длинный список и скроллит вручную.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      При большом числе клиентов резко растёт вероятность выбрать не того
      клиента или потратить много времени на поиск. Это уже отклонение от
      согласованной UX-спеки для страницы заказов.

      КАК ДОЛЖНО РАБОТАТЬ:
      В форме должен быть автокомплит по имени/телефону, как описано в
      `lab/orders-system.md` (раздел 8.2, пункт "Автокомплит по имени/телефону").

    code_example: |
      # Проблемный код:
      <Select value={selectedCustomerId} onValueChange={setSelectedCustomerId}>
        <SelectTrigger ...>
          <SelectValue placeholder="Выберите клиента" />
        </SelectTrigger>
        <SelectContent>...</SelectContent>
      </Select>

      # Как исправить:
      # Использовать searchable combobox / autocomplete:
      # - фильтр по name/phone
      # - быстрый переход к "Новый клиент"

    found_count: 2
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:22:32Z
        agrees: true
        note: "Раунд 4: сверка реализации с lab/orders-system.md."
      - agent: validator-spec
        timestamp: 2026-02-11T20:22:32Z
        agrees: true
        note: "Параллельный агент подтвердил отсутствие автокомплита клиента."
    fix: null

  - id: e-orders-002
    file: client/src/pages/sold-items.tsx
    category: spec-mismatch
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Поле "Кто платит" скрывается только в одном случае:
      если выбран самовывоз И стоимость доставки равна 0.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Для обычной доставки с нулевой стоимостью поле остаётся видимым и
      значение отправляется в payload, хотя по спецификации при нулевой
      стоимости поле должно скрываться.
      Это ведёт к несогласованному UX и "лишним" данным в запросе.

      КАК ДОЛЖНО РАБОТАТЬ:
      При `deliveryPrice == 0` поле "Кто платит" должно скрываться и
      отправляться как null (см. `lab/orders-system.md`, раздел 8.2).

    code_example: |
      # Проблемный код:
      const deliveryPriceNumber = Number(deliveryPrice || 0);
      const shouldShowPayer = !(isPickup && deliveryPriceNumber === 0);
      ...
      deliveryPayer: shouldShowPayer ? deliveryPayer : null,

      # Как исправить:
      # Например:
      # const shouldShowPayer = Number(deliveryPrice || 0) > 0;
      # deliveryPayer: shouldShowPayer ? deliveryPayer : null

    found_count: 3
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:22:32Z
        agrees: true
        note: "Раунд 3/4: проверка условий формы отправки + сверка со spec."
      - agent: validator-spec
        timestamp: 2026-02-11T20:22:32Z
        agrees: true

  - id: e-orders-007
    file: client/src/pages/sold-items.tsx
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Перед созданием заказа страница проверяет остаток по коробке через
      `queryClient.getQueryData("/api/stock/:smart/boxes")`, то есть по кэшу React Query.
      После успешного заказа кэш только инвалидируется, но refetch происходит не мгновенно.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Пользователь может сразу оформить второй заказ и выбрать коробку с уже
      проданным остатком из устаревшего списка. Клиентская проверка пропускает
      этот сценарий, а сервер возвращает 400 (`В коробке ... только 0 шт`).
      На практике это выглядит как "форма предлагает невалидный вариант".

      КАК ДОЛЖНО РАБОТАТЬ:
      Перед submit нужна проверка по свежим данным (fetch/ensureQueryData),
      либо после успешного заказа форма должна ждать refetch и блокировать повторный
      submit до синхронизации остатков.

    code_example: |
      # Проблемный код (валидация по кэшу):
      const boxRows = queryClient.getQueryData([`/api/stock/${smartEncoded}/boxes`]);
      const available = (boxRows || []).find((r) => r.boxNumber === entry.boxNumber)?.qty;

      # После успеха только invalidate (асинхронно):
      onSuccess: () => {
        invalidateAfterOrderChanges();
      }

      # Как исправить:
      # - перед submit читать свежие данные через ensureQueryData/refetchQuery
      # - или блокировать повторный submit до завершения refetch остатков

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:44:54Z
        agrees: true
        note: |
          Практический прогон через agent-browser:

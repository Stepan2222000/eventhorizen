      Bootstrap схемы выполняет DDL/VIEW шаги без межпроцессного lock.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      При одновременных стартах процессов возможен deadlock и падение приложения.

      КАК ДОЛЖНО РАБОТАТЬ:
      Использовать advisory lock/миграционный lock или отдельный процесс миграции.
    code_example: |

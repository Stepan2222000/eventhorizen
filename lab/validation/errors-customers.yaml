  - id: i-cust-sub-01
    file: client/src/lib/queryClient.ts
    category: suboptimal

    issue: |
      ЧТО НЕ ТАК:
      В качестве queryKey используется URL-строка ("/api/customers?query=..."), из-за чего
      инвалидация должна угадывать все возможные варианты строк. Это уже привело к багам
      (инвалидируется "/api/customers", но не "/api/customers?includeArchived=1" и т.п.).

      ПОЧЕМУ ЭТО ПЛОХО:
      - Сложно гарантировать корректную инвалидацию при staleTime = Infinity
      - Легко накопить кэш на десятки уникальных строк (поиск), что увеличивает память

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Перейти на нормализованные queryKeys:
        ["customers", { query, includeArchived }]
      А queryFn строит URL по объекту параметров.
      Тогда инвалидация "всех клиентов" = invalidateQueries({ queryKey: ["customers"] }).

    code_example: |
      // Сейчас:
      queryKey: ["/api/customers?query=..."]

      // Лучше:
      queryKey: ["customers", { query, includeArchived }]


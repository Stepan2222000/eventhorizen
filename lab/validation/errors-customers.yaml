    category: dry-violation

    issue: |
      ЧТО НЕ ТАК:
      Логика invalidateQueries с predicate по префиксу URL копируется в нескольких местах
      (например startsWith("/api/orders") в customers.tsx, customer-details.tsx, sold-items.tsx).
      При этом для "/api/customers" часть страниц делает точечную инвалидацию, часть — по префиксу,
      из-за чего легко допустить баги (как в текущем коде).

      ПОЧЕМУ ЭТО ПЛОХО:
      - Легко забыть инвалидировать нужный вариант queryKey (особенно с query string)
      - Код размазан по страницам и сложно проверить полноту инвалидации
      - staleTime = Infinity усиливает последствия любой ошибки инвалидации

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Вынести общий helper, например:
        invalidateByPrefix(queryClient, "/api/orders")
        invalidateByPrefix(queryClient, "/api/customers")
      И использовать его везде, где сейчас повторяется predicate-логика.


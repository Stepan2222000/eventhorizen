    fix: null

  - id: e-soldout-005
    file: client/src/pages/sold-out.tsx
    category: spec-mismatch
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      При сетевой ошибке страница показывает сырое сообщение браузера
      `Failed to fetch` через `error.message`.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Интерфейс в целом русскоязычный, но в ошибочном сценарии пользователь
      видит англоязычный технический текст без подсказки, что делать дальше.

      КАК ДОЛЖНО РАБОТАТЬ:
      Для сетевых/транспортных ошибок показывать локализованный fallback
      (например: "Не удалось загрузить распроданные товары. Проверьте соединение.")
      и кнопку повтора.

    code_example: |
      # Проблемный код:
      # {error instanceof Error ? error.message : "Ошибка загрузки распроданных товаров"}
      #
      # Как исправить:
      # Маппить сетевые ошибки на русскоязычное сообщение + retry.

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:40:50Z
        agrees: true
        note: |
          Практически воспроизведено через agent-browser с network abort.
          Скриншот:

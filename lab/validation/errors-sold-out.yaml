errors:
  - id: e-soldout-001
    file: py_backend/storage.py
    category: spec-mismatch
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      `lastSaleDate` формируется в UTC через `toDateIso()`, но на клиенте
      отображается через `new Date(...)/format(...)` в таймзоне браузера.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Для пользователей не в московской таймзоне дата последней продажи
      может сместиться на предыдущий/следующий день. На странице "Распроданные товары"
      это даёт неверную бизнес-дату.

      КАК ДОЛЖНО РАБОТАТЬ:
      Дата должна отображаться в одной фиксированной бизнес-таймзоне
      (Москва), либо сервер должен отдавать уже "date-only" поле без
      повторной интерпретации на клиенте.

    code_example: |
      # Проблемный код:
      # py_backend/storage.py
      # "lastSaleDate": toDateIso(_obj_get(row, "last_sale_date"))
      #
      # client/src/pages/sold-out.tsx
      # format(new Date(item.lastSaleDate), "dd.MM.yyyy", { locale: ru })
      #
      # Как исправить:
      # 1) Форматировать в фиксированной зоне Europe/Moscow на клиенте, или
      # 2) Отдавать из API отдельное поле вида "lastSaleDateLocal": "2026-02-11".

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:21:53Z
        agrees: true
        note: "Раунды 3-5: подтверждено на стыке py_backend/storage.py и client/src/pages/sold-out.tsx"

    fix: null

  - id: e-soldout-002
    file: py_backend/storage.py
    category: logic-error
    severity: critical

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Средняя цена продажи в `getSoldOutItems()` считается так:
      SUM(COALESCE(sale_price, 0) * ABS(qty_delta)) / SUM(ABS(qty_delta)).
      Продажи с `sale_price = NULL` попадают в знаменатель как обычные продажи,
      но в числитель как нулевая цена.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Legacy-данные (до добавления колонки sale_price) и любые записи с NULL
      систематически занижают `avgSalePrice`. Страница показывает неверную
      аналитику по распроданным товарам.

      КАК ДОЛЖНО РАБОТАТЬ:
      Нельзя подставлять 0 для отсутствующей цены продажи.
      Либо исключать такие строки из расчёта средней,
      либо иметь отдельный fallback-источник цены.

    code_example: |
      # Проблемный код:
      # SUM(CAST(COALESCE(sale_price, 0) AS NUMERIC) * ABS(qty_delta))
      # / NULLIF(SUM(ABS(qty_delta)), 0)
      #
      # Как исправить:
      # SUM(CASE WHEN sale_price IS NOT NULL THEN sale_price * ABS(qty_delta) ELSE 0 END)
      # /
      # NULLIF(SUM(CASE WHEN sale_price IS NOT NULL THEN ABS(qty_delta) ELSE 0 END), 0)

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:21:53Z
        agrees: true
        note: "Раунды 2-5: подтверждено по SQL в getSoldOutItems() и истории схемы inventory.movements"

    fix: null

  - id: e-soldout-003
    file: py_backend/routes.py
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Эндпоинт GET /api/sold-out ловит все исключения и всегда отдаёт
      общий текст "Failed to get sold out items" без детализации.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      При повторяемых продовых ошибках (например, ошибка SQL или проблемы пула)
      диагностика затягивается: у клиента одинаковая ошибка, на уровне API
      не сохраняется контекст конкретного падения.

      КАК ДОЛЖНО РАБОТАТЬ:
      Возвращать безопасный текст клиенту, но логировать внутреннюю причину
      на сервере (structured logging, traceback, request context).

    code_example: |
      # Проблемный код:
      # except Exception:
      #     return JSONResponse(status_code=500, content={"error": "Failed to get sold out items"})
      #
      # Как исправить:
      # except Exception as err:
      #     logger.exception("GET /api/sold-out failed: %s", err)
      #     return JSONResponse(status_code=500, content={"error": "Failed to get sold out items"})

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:21:53Z
        agrees: true
        note: "Раунды 3-5: подтверждено в обработчике GET /api/sold-out"

    fix: null

  - id: e-soldout-004
    file: client/src/pages/sold-out.tsx
    category: state-corruption
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Страница использует React Query c глобальными настройками
      `staleTime: Infinity` и `refetchOnWindowFocus: false`.
      На самой странице нет ручного refresh.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Если данные изменились вне текущей вкладки (другая вкладка, API-скрипт,
      внешняя операция), UI продолжает показывать старые строки.
      Практически воспроизведено:
      - API `/api/sold-out` уже вернул `[]`
      - страница продолжала показывать `Найдено записей: 1`
      - обновилось только после hard reload.

      КАК ДОЛЖНО РАБОТАТЬ:
      Нужен способ принудительного обновления данных:
      кнопка "Обновить", `refetchOnMount`, либо периодический refetch
      для аналитических страниц.

    code_example: |
      # Проблемный код:
      # client/src/lib/queryClient.ts
      # staleTime: Infinity
      # refetchOnWindowFocus: false
      #
      # client/src/pages/sold-out.tsx
      # useQuery<SoldOutItem[]>({ queryKey: ['/api/sold-out'] })
      #
      # Как исправить:
      # Добавить ручной refetch на странице или включить refetchOnMount для этого query.

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:40:50Z
        agrees: true
        note: |
          Практический e2e сценарий через agent-browser подтверждён.

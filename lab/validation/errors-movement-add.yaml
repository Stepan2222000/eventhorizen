  - id: i-mov-005
    file: py_backend/storage.py
    category: suboptimal

    issue: |
      ЧТО НЕ ТАК:
      `toInt()` используется для критических пользовательских количеств (`qty`, `qtyDelta`, `qty` в order items),
      и делает truncation для float/строк с дробной частью.

      ПОЧЕМУ ЭТО ПЛОХО:
      Это может приводить к "тихим" изменениями данных и несовпадению ожиданий пользователя.

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Добавить строгие парсеры:
      - `requireInt(value, field)` (требует целое, иначе InvalidRequestError)
      - `requirePositiveInt(value, field)`
      И использовать их для qty/qtyDelta в публичных API методах.

    code_example: |
      # py_backend/storage.py
      qty = toInt(data.get("qty"))  # transferBetweenBoxesAttempt
      qty = toInt(item_dict.get("qty"))  # createOrder

    found_count: 1
    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:50:49Z
        note: "Раунд 4: снизить риск silent truncation в публичных эндпоинтах."


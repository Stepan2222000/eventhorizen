  - id: e-mov-005
    file: client/src/pages/add-movement.tsx
    category: logic-error
    severity: critical

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      При наличии URL-prefill (`?smart=...`) форма инициализируется с `defaultValues.smart = prefillSmart`.

      `resetForm()` делает:
      1) `form.reset()` (сбрасывает значения к ИСХОДНЫМ defaultValues, включая prefillSmart)
      2) `setSearchKey(...)` (ремоунт SmartSearch)
      3) `clearPrefillParamsFromUrl()` (удаляет `smart` из URL)

      На следующем рендере `prefillSmart` уже `undefined`, поэтому SmartSearch визуально очищается,
      но `react-hook-form` поле `smart` остается заполненным старым prefill-значением после `form.reset()`.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Пользователь увидит пустой поиск SMART, но отправит движение по старому SMART (валидация пройдет,
      потому что `form` считает `smart` заполненным). Это может привести к записи движения на неправильный товар.

      КАК ДОЛЖНО РАБОТАТЬ:
      `resetForm()` должен сбрасывать `smart` синхронно с UI:
      - либо явно `form.reset({...}, { keepDefaultValues: false })` с `smart: ""`,
      - либо после reset сделать `form.setValue("smart", "")`,
      - либо не очищать SmartSearch после prefill (тогда и поле, и UI должны оставаться заполненными).

    code_example: |
      # client/src/pages/add-movement.tsx
      const prefillSmart = new URLSearchParams(window.location.search).get("smart") ?? undefined;

      const form = useForm<FormData>({
        defaultValues: { smart: prefillSmart || "", ... }
      });

      const resetForm = () => {
        form.reset();             // вернет smart обратно в prefillSmart
        setSearchKey((k) => k + 1); // ремоунт SmartSearch (уже без defaultValue после очистки URL)
        clearPrefillParamsFromUrl(); // убирает smart из URL
      };

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:47:12Z
        agrees: true
        note: "Раунд 3: высокий риск скрытого stale smart после reset при URL-prefill."

    fix: null

improvements:
  - id: i-mov-001
    file: client/src/pages/add-movement.tsx
    category: dry-violation

    issue: |
      ЧТО НЕ ТАК:
      Инвалидация кэшей после изменений склада/движений дублируется в нескольких местах:
      - `client/src/pages/add-movement.tsx`
      - `client/src/pages/stock-details.tsx` (transfer/update)
      - `client/src/pages/box-details.tsx` (transfer/inventory)

      ПОЧЕМУ ЭТО ПЛОХО:
      Легко забыть инвалидировать новый ключ (или удалить старый), из-за чего часть страниц
      будет показывать устаревшие данные при `staleTime: Infinity`.

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Вынести в общий helper/хук (например `invalidateAfterMovementChange(queryClient, smart)`),
      чтобы все места использовали один список ключей.

    code_example: |
      # client/src/pages/add-movement.tsx
      queryClient.invalidateQueries({ queryKey: ["/api/movements"] });
      queryClient.invalidateQueries({ queryKey: ["/api/stock"] });
      queryClient.invalidateQueries({ queryKey: ["/api/dashboard/stats"] });
      ...


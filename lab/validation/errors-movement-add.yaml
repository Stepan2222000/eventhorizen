errors:
  - id: e-mov-001
    file: py_backend/storage.py
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Валидация цен в `validateAndSanitizeForInsert()` и `updateMovement()` проверяет только "это число",
      но не проверяет неотрицательность.

      В результате отрицательные значения (например, `purchasePrice = "-10"`) проходят валидацию,
      после чего Postgres отклоняет INSERT/UPDATE по CHECK-констрейнтам:
      - `movements_purchase_price_non_negative_chk`
      - `movements_sale_price_non_negative_chk`
      - `movements_delivery_price_non_negative_chk`

      Эти ошибки не маппятся в `InvalidRequestError`, поэтому клиент получает 500 и "сырой" текст БД,
      хотя это ошибка ввода.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Пользователь случайно введет отрицательную цену (или поставит минус, затем передумает) и не сможет
      сохранить движение/правку, увидит "ошибка сервера" вместо нормальной подсказки.

      КАК ДОЛЖНО РАБОТАТЬ:
      - На уровне приложения валидировать цены как НЕОТРИЦАТЕЛЬНЫЕ (до обращения к БД).
      - При нарушении возвращать 400 с понятным сообщением.

    code_example: |
      # py_backend/storage.py (validateAndSanitizeForInsert)
      requireNumberString(purchase_price, "Цена закупки")   # не проверяет >= 0
      requireNumberString(sale_price, "Цена продажи")       # не проверяет >= 0
      requireNumberString(delivery_price, "Стоимость доставки")  # не проверяет >= 0

      # py_backend/storage.py (updateMovement)
      price = requireNumberString(purchase_price, "Цена закупки")  # не проверяет >= 0

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:45:13Z
        agrees: true
        note: "Раунд 2-3: реальный ввод пользователя может давать 500 из-за CHECK constraints."

    fix: null

  - id: e-mov-002
    file: py_backend/storage.py
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      В `transferBetweenBoxesAttempt()` количество берется как `qty = toInt(data.get("qty"))`.
      `toInt()` для float/строк с дробью делает truncation: `1.9 -> 1`.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Клиент (или UI) может отправить дробное значение, пользователь увидит/введет одно число,
      а на сервере фактически переместится другое (меньшее) количество без явной ошибки.

      КАК ДОЛЖНО РАБОТАТЬ:
      Явно требовать целое число (например, проверить что исходное значение int / что float is_integer())
      и возвращать 400 при попытке передать дробь.

    code_example: |
      # py_backend/storage.py
      qty = toInt(data.get("qty"))  # 1.9 -> 1
      if qty <= 0:
          raise InvalidRequestError("Количество должно быть положительным")

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:45:13Z
        agrees: true
        note: "Раунд 3: для transfer qty должен быть строго int, сейчас silently truncates."

    fix: null

  - id: e-mov-003
    file: client/src/pages/stock-details.tsx
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      В модалке перемещения количество парсится через `Number(e.target.value)`, без проверки на целое.
      Дробные значения могут уйти на сервер как float.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Серверная логика transfer сейчас truncates qty через `toInt()` (см. e-mov-002),
      поэтому при вводе "1.5" пользователь ожидает одно, а фактически переместится 1 шт.

      КАК ДОЛЖНО РАБОТАТЬ:
      - На клиенте ограничить ввод целыми (parseInt / Number.isInteger) и/или выставить step=1 явно.
      - При нецелом значении показывать ошибку и не отправлять запрос.

    code_example: |
      # client/src/pages/stock-details.tsx
      <Input
        type="number"
        min={1}
        max={transferMax}
        value={transferQty}
        onChange={(e) => setTransferQty(Number(e.target.value) || 1)}
      />

      const qty = Number(transferQty);  // может быть 1.5

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:45:13Z
        agrees: true
        note: "Раунд 2-3: клиент допускает дробь, сервер молча округляет вниз."

    fix: null


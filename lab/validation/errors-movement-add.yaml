  - id: i-mov-003
    file: client/src/components/smart-search.tsx
    category: suboptimal

    issue: |
      ЧТО НЕ ТАК:
      `SmartSearch` хранит внутреннее состояние `inputValue/selectedItem`, а форма (`react-hook-form`)
      хранит своё поле `smart`. Связка идет через `onSelect/onClear` и принудительный remount через `key`.

      ПОЧЕМУ ЭТО ПЛОХО:
      Это повышает риск рассинхронизации UI и реальных данных формы (пример уже проявляется в e-mov-005).

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Сделать `SmartSearch` контролируемым компонентом:
      - принимать `value` и `onValueChange`,
      - отделить "текст в инпуте" от "выбранный smart",
      - убрать reset через `key`, сбрасывать через value.

    code_example: |
      # client/src/components/smart-search.tsx
      const [inputValue, setInputValue] = useState(defaultValue ?? "");
      const [selectedItem, setSelectedItem] = useState<ArticleSearchResult | null>(null);

    found_count: 1
    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:50:49Z
        note: "Раунд 4: уменьшить риск рассинхронизаций, сделать компонент controlled."

    fix: null


          одновременно отображаются "Failed to fetch" и
          "Показано 0 движений (отфильтровано из 0 всего)".

    fix: null

  - id: e-mh-106
    file: client/src/pages/movement-history.tsx
    category: edge-case
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Текстовый фильтр сравнивается как есть (`includes(filter.toLowerCase())`) без `trim()`.
      Если пользователь вводит корректное значение с хвостовым/начальным пробелом,
      совпадения не находятся.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Частый сценарий копипаста из мессенджера/таблицы с лишним пробелом
      приводит к ложному "Нет совпадений с фильтром", хотя записи есть.

      КАК ДОЛЖНО РАБОТАТЬ:
      Нормализовать пользовательский запрос (`const q = filter.trim().toLowerCase()`),
      и фильтровать уже по `q`.

    code_example: |
      // Текущий код:
      movement.smart.toLowerCase().includes(filter.toLowerCase())

      // Как исправить:
      const q = filter.trim().toLowerCase();
      movement.smart.toLowerCase().includes(q)

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-12T00:35:18+04:00
        agrees: true
        note: |
          Практика (agent-browser): `smart_00001` даёт 56 строк, а `smart_00001 `
          даёт 0 строк и "Нет совпадений с фильтром".

    fix: null


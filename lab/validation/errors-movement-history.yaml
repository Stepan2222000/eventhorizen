  - id: i-mh-002
    file: client/src/pages/movement-history.tsx
    category: suboptimal

    issue: |
      ЧТО НЕ ТАК:
      qtyDelta=0 (например, миграционная запись reconcile) отображается как "+0" зелёным цветом.

      ПОЧЕМУ ЭТО ПЛОХО:
      0 не является ни приходом, ни расходом, но визуально выглядит как "успешный приход".

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Для 0 показывать нейтральный стиль (без '+', muted-цвет), либо отдельный бейдж "0".

    code_example: |
      // client/src/pages/movement-history.tsx
      movement.qtyDelta >= 0 ? 'text-success' : 'text-destructive'
      movement.qtyDelta >= 0 ? '+' : ''

    found_count: 1
    findings:

  - id: i-mh-003
    file: client/src/pages/movement-history.tsx
    category: suboptimal

    issue: |
      ЧТО НЕ ТАК:
      Для transfer стрелка/направление хранится в `note` (например, `→ K-7 · user note`),
      и в UI она показывается и в колонке "Коробка", и дублируется в колонке "Примечание".

      ПОЧЕМУ ЭТО ПЛОХО:
      - визуальный шум (дублирование одной и той же информации)
      - сложнее искать/читать пользовательское примечание (оно смешано с системной стрелкой)

      КАК СДЕЛАТЬ ЛУЧШЕ:
      На UI: в колонке "Примечание" для transfer показывать только пользовательскую часть
      (после разделителя `·`), а стрелку оставить только в колонке "Коробка".

    code_example: |
      // client/src/pages/movement-history.tsx
      movement.reason === "transfer" && movement.note
        ? `${movement.boxNumber || "—"} ${movement.note.split("·")[0].trim()}`
        : (movement.boxNumber || "—")

      // При этом колонка "Примечание" сейчас выводит movement.note целиком.

    found_count: 1

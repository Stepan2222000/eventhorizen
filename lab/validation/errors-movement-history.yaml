  - id: e-mh-103
    file: client/src/pages/movement-history.tsx
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Дата/время отображается через `toLocaleString('ru-RU')` без фиксированного timezone.
      Это означает рендер во временной зоне браузера.

      На сервере же timestamp нормализуется через business timezone (Europe/Moscow)
      перед сериализацией (`toDateIso`).

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Если рабочая станция не в московской зоне, история на экране показывает
      смещённое время операций относительно бизнес-часов склада.

      КАК ДОЛЖНО РАБОТАТЬ:
      Явно зафиксировать timezone на клиенте (`Europe/Moscow`) или явно обозначить,
      что время показывается в локальной зоне пользователя.

    code_example: |
      // client/src/pages/movement-history.tsx
      new Date(dateString).toLocaleString('ru-RU', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      });

      # py_backend/storage.py
      # naive datetime трактуется как BUSINESS_TZ и уходит в UTC ISO
      return dt.astimezone(timezone.utc).isoformat(...).replace("+00:00", "Z")

    found_count: 3
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-12T00:18:46+04:00
        agrees: true
        note: |
          Раунд 5: подтверждено как реальный риск для пользователей вне Europe/Moscow.
          Для локальной московской зоны проблема не проявляется.
      - agent: validator-1
        timestamp: 2026-02-12T00:34:50+04:00
        agrees: true
        note: |
          Практика (agent-browser): timezone браузера `Asia/Dubai`.
          Для одного и того же `createdAt` UI показывает `11.02.2026, 21:32`,
          а формат в `Europe/Moscow` даёт `11.02.2026, 20:32` (сдвиг +1 час).
      - agent: validator-1
        timestamp: 2026-02-12T00:37:30+04:00
        agrees: true
        note: |
          Повторная проверка (agent-browser): `createdAt=2026-02-11T17:36:07.342Z`,
          локальный рендер (Asia/Dubai) = `11.02.2026, 21:36`,
          рендер в `Europe/Moscow` = `11.02.2026, 20:36`.

    fix: null


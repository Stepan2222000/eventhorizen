errors:
  - id: e-mh-101
    file: py_backend/routes.py
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Эндпоинт `GET /api/movements` оборачивает вызов `storage.getMovements(...)`
      в общий `except Exception` и всегда отвечает `500 Failed to get movements`.

      При этом `storage.getMovements()` валидирует `boxNumber` через `requireBoxName()`
      и может выбросить `InvalidRequestError` (например, при `boxNumber` с `/` или длиной > 50).

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Клиентская ошибка параметра фильтра превращается в серверную 500.
      На UI это выглядит как "поломка сервера", хотя запрос просто невалидный.

      КАК ДОЛЖНО РАБОТАТЬ:
      Для `InvalidRequestError` возвращать 400 с понятным сообщением,
      а 500 оставлять только для реальных инфраструктурных сбоев.

    code_example: |
      # Проблемный код (py_backend/routes.py):
      @app.get("/api/movements")
      async def get_movements(request: Request) -> Response:
          ...
          try:
              movements = await storage.getMovements({"boxNumber": box_number} if box_number else None)
              return JSONResponse(content=movements)
          except Exception:
              return JSONResponse(status_code=500, content={"error": "Failed to get movements"})

      # Как исправить:
      except InvalidRequestError as err:
          return JSONResponse(status_code=400, content={"error": str(err)})
      except Exception:
          return JSONResponse(status_code=500, content={"error": "Failed to get movements"})

    found_count: 2
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-12T00:18:46+04:00
        agrees: true
        note: "Раунд 3/4: несоответствие статуса ошибки для невалидного boxNumber."
      - agent: validator-1
        timestamp: 2026-02-12T00:34:50+04:00
        agrees: true
        note: |
          Практика (agent-browser): `fetch('/api/movements?boxNumber=BAD%2FBOX')`
          возвращает `500 {"error":"Failed to get movements"}` вместо клиентского 400.

    fix: null

  - id: e-mh-102
    file: client/src/pages/movement-history.tsx
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Запрос коробок (`/api/boxes`) читается только как `data: boxesData`.
      Состояния `isError/error` для этого запроса не обрабатываются.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      При временной ошибке API/сети селект коробок "тихо" остаётся только с пунктом
      "Все коробки", без индикации проблемы. Пользователь теряет фильтр по коробке
      и не понимает, что это ошибка загрузки.

      КАК ДОЛЖНО РАБОТАТЬ:
      Показывать явную ошибку загрузки коробок (или disabled-селект + retry),
      чтобы состояние не маскировалось под "просто нет коробок".

    code_example: |
      // Проблемный код:
      const { data: boxesData } = useQuery<{ boxes: Array<{ name: string; isActive: boolean }> }>({
        queryKey: ["/api/boxes"],
      });

      // В рендере используется только boxesData?.boxes, без ветки boxesError.

      // Как исправить:
      const { data: boxesData, isError: isBoxesError, error: boxesError, refetch: refetchBoxes } = useQuery(...);
      // Показать сообщение + кнопку "Повторить".

    found_count: 2
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-12T00:18:46+04:00
        agrees: true
        note: "Раунд 2/3: ошибка загрузки коробок не отображается."
      - agent: validator-1
        timestamp: 2026-02-12T00:34:50+04:00
        agrees: true
        note: |
          Практика (agent-browser): при `network route "**/api/boxes" --abort`
          селект содержит только "Все коробки", без текста ошибки и без retry.


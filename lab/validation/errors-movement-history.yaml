    issue: |
      ЧТО НЕ ТАК:
      `qtyDelta = 0` отображается тем же цветом/паттерном, что и положительные значения
      (`text-success`, префикс `+`).

      ПОЧЕМУ ЭТО ПЛОХО:
      Нулевое изменение визуально воспринимается как "приход", что искажает чтение журнала

  - id: e-mh-105
    file: client/src/pages/movement-history.tsx
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      При ошибке загрузки `/api/movements` таблица корректно показывает строку ошибки,
      но нижний блок со счётчиком всё равно рендерится, потому что он зависит только от
      `!isLoading`, а не от `isError`.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Пользователь одновременно видит "Failed to fetch" и "Показано 0 движений
      (отфильтровано из 0 всего)", что выглядит как валидный пустой результат, а не
      как сбой запроса.

      КАК ДОЛЖНО РАБОТАТЬ:
      В состоянии `isError` не показывать счётчик результатов (или заменить его на
      явный error-state блок), чтобы не смешивать "ошибка" и "пустой список".

    code_example: |
      // Проблемный код:
      {isError ? <ErrorRow /> : ...}
      ...
      {!isLoading && (
        <div>Показано {filteredMovements.length} движений ...</div>
      )}

      // Как исправить:
      {!isLoading && !isError && (
        <div>Показано {filteredMovements.length} движений ...</div>
      )}

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-12T00:34:50+04:00
        agrees: true
        note: |

errors:
  - id: e-top-001
    file: py_backend/storage.py
    category: race-condition
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Метод getTopParts() собирает данные через 7 независимых SELECT в asyncio.gather.
      Каждый запрос читает БД в свой момент времени.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      При одновременных продажах/возвратах часть наборов будет "до изменения",
      а часть "после изменения". В одной выдаче рейтинга могут смешиваться
      несовместимые срезы данных (qty, cost, delivery).

      КАК ДОЛЖНО РАБОТАТЬ:
      Все данные для расчёта рейтинга должны читаться из одного согласованного
      snapshot (одна транзакция READ ONLY REPEATABLE READ или один SQL-пайплайн/CTE).

    code_example: |
      # Проблемный код:
      (
          avg_purchase_rows,
          stock_rows,
          legacy_sales_rows,
          legacy_return_rows,
          order_items_rows,
          shipment_cost_rows,
          return_cost_rows,
      ) = await asyncio.gather(
          self.inventoryPool.fetch(...),
          self.inventoryPool.fetch(...),
          ...
      )

      # Как исправить:
      # 1) BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ;
      # 2) Выполнить все SELECT через один client внутри транзакции.
      # или
      # Собрать расчёт в один SQL с CTE, чтобы чтение было атомарным.

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:17:47Z
        agrees: true
        note: "Раунд 4: контекстный анализ связей и состояния между параллельными чтениями."
    fix: null

  - id: e-top-002
    file: py_backend/storage.py
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Если по SMART-коду нет закупок с purchase_price, средняя закупка берётся как 0.0.
      Дальше прибыль считается как revenue - 0 - delivery, что завышает avgProfit.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Товары без истории закупки (часто после миграций/импортов) поднимаются в топ
      по доходности, хотя их себестоимость неизвестна, а не равна нулю.

      КАК ДОЛЖНО РАБОТАТЬ:
      Для SMART без валидной себестоимости нужно:
      - либо исключать их из режима "profit",
      - либо маркировать как "нехватает данных" и не ранжировать как прибыльные.

    code_example: |
      # Проблемный код:
      avg_purchase = avg_purchase_by_smart.get(smart, 0.0)
      ...
      total_profit = acc["revenue"] - acc["cost"] - acc["deliveryCost"]

      # Как исправить:
      # Сохранять флаг has_purchase_cost и отдельно обрабатывать такие позиции:
      # if not has_purchase_cost: continue  # для режима profit
      # или возвращать поле dataQuality="missing_purchase_cost".

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:17:47Z
        agrees: true
        note: "Раунд 3: глубокая проверка входных данных и полноты финансовой модели."
    fix: null

  - id: e-top-003
    file: py_backend/storage.py
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Распределение доставки/возврата делается пропорцией от value = sale_price * qty.
      Если sale_price = 0 или NULL, value = 0 и строка исключается из аллокации.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Позиции с нулевой/пустой ценой (акции, ошибки ввода, частичный импорт)
      получают 0 доли доставки, хотя физически занимали место в отправке/возврате.
      Это системно завышает их прибыль и искажает ranking.

      КАК ДОЛЖНО РАБОТАТЬ:
      При value <= 0 нужен fallback распределения (например, по qty),
      а не полное исключение из расчёта доставки.

    code_example: |
      # Проблемный код:
      value = toFloat(_obj_get(row, "sale_price")) * toInt(_obj_get(row, "qty"))
      if value <= 0:
          continue

      # Как исправить:
      # если sale_price невалиден или <= 0, использовать вес по qty:
      # value = max(toFloat(sale_price), 0.0) * qty
      # if value <= 0: value = float(qty)

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:17:47Z
        agrees: true
        note: "Раунд 3 и Раунд 5: подтверждено на ветках shipment_cost и return_cost."
    fix: null

  - id: e-top-004
    file: client/src/pages/top-parts.tsx
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      При ошибке запроса одного режима (например, mode=sales) компонент
      уходит в ранний return с error-card и полностью скрывает Tabs.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Если сбой кратковременный только для одного режима, пользователь теряет
      возможность переключиться обратно на рабочие режимы (profit/combined).
      После восстановления сети страница не восстанавливается сама
      (retry=false), и фактически требуется ручной reload.

      КАК ДОЛЖНО РАБОТАТЬ:
      Ошибка должна быть локальной для текущего режима внутри tab content,
      при этом сами вкладки должны оставаться доступны для переключения.
      Нужна явная кнопка "Повторить" для refetch текущего режима.

    code_example: |
      // Проблемный код:
      const { data: items, isLoading, isError, error } = useQuery<TopPart[]>({
        queryKey: [`/api/top-parts?mode=${mode}`],
      });

      if (isError) {
        return (
          <Page ...>
            <Card>...</Card>
          </Page>
        );
      }

      // Усиление проблемы:
      // queryClient.ts -> queries.retry = false

      // Как исправить:
      // 1) Всегда рендерить Tabs с триггерами.
      // 2) Error показывать внутри TabsContent текущего режима.
      // 3) Добавить кнопку retry (invalidateQueries/refetch).

    found_count: 1
    rejected_count: 0
    findings:
      - agent: validator-1
        timestamp: 2026-02-11T20:43:13Z
        agrees: true
        note: |
          Подтверждено через agent-browser:
          1) route abort only for /api/top-parts?mode=sales
          2) click "По продажам" -> появляется "Failed to fetch"
          3) вкладки исчезают из DOM (snapshot -i: только sidebar controls)
          4) даже после unroute состояние не восстанавливается без reload.
    fix: null


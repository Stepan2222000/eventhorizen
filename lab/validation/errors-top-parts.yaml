improvements:
  - id: i-top-001
    file: client/src/pages/add-movement.tsx
    category: dry-violation

    issue: |
      ЧТО НЕ ТАК:
      Инвалидация кэша для top-parts (3 режима: profit/sales/combined) продублирована вручную в нескольких местах:
      - client/src/pages/add-movement.tsx
      - client/src/pages/bulk-import.tsx
      - client/src/pages/order-details.tsx
      - client/src/pages/sold-items.tsx

      ПОЧЕМУ ЭТО ПЛОХО:
      При `staleTime: Infinity` любая забытая инвалидация приводит к "вечной" устаревшей аналитике.
      Дублирование повышает риск, что в одном из мест забудут один из режимов или добавят новый режим и не обновят все вызовы.

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Вынести в одну helper-функцию (например, `invalidateTopParts(queryClient)`),
      или инвалидировать по predicate: `startsWith("/api/top-parts")` вместо 3 отдельных ключей.

    code_example: |
      // Текущий код (пример из add-movement.tsx):
      queryClient.invalidateQueries({ queryKey: [`/api/top-parts?mode=profit`] });
      queryClient.invalidateQueries({ queryKey: [`/api/top-parts?mode=sales`] });
      queryClient.invalidateQueries({ queryKey: [`/api/top-parts?mode=combined`] });

      // Как улучшить (пример):
      queryClient.invalidateQueries({
        predicate: (q) =>
          Array.isArray(q.queryKey) &&
          typeof q.queryKey[0] === "string" &&
          q.queryKey[0].startsWith("/api/top-parts"),
      });

    found_count: 1

    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:48:19Z
        note: "Раунд 4: DRY, чтобы не ловить вечные stale-данные по одному из режимов"

    fix: null

  - id: i-top-002
    file: py_backend/storage.py
    category: suboptimal

    issue: |
      ЧТО НЕ ТАК:
      Формула `combinedScore` захардкожена с магическими числами (`/10`, clamp до 100, веса 0.5/0.5),
      и не описано, что означает масштаб коэффициента (0..100? 0..10?).

      ПОЧЕМУ ЭТО ПЛОХО:
      - Трудно объяснить пользователю, почему коэффициент именно такой (напр., 1.9).
      - Любые изменения формулы сложнее делать безопасно: нет места, где явно заданы константы/комментарии.

      КАК СДЕЛАТЬ ЛУЧШЕ:
      - Вынести константы в именованные переменные (например, `SALES_NORM_DIVISOR`, `PROFIT_NORM_DIVISOR`, `MAX_NORM`).
      - Добавить комментарий, какой диапазон ожидается.
      - Опционально: добавить тест-кейсы на несколько сценариев (profit<0, sales>>1000, sales=0).

    code_example: |
      normalized_sales = min(total_sales / 10, 100)
      normalized_profit = min(max(avg_profit, 0) / 10, 100)
      combined_score = normalized_sales * 0.5 + normalized_profit * 0.5


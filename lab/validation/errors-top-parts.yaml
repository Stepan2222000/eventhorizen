errors:
  - id: e-top-001
    file: client/src/pages/top-parts.tsx
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Страница проверяет только `isLoading`. Если запрос упал (500/NetworkError),
      `isLoading === false`, а `items === undefined`, и UI показывает
      "Нет данных для отображения" как будто продаж не было.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Пользователь получает ложный вывод "нет данных" вместо сообщения об ошибке,
      и может принять решение на основе неверной картины (особенно при staleTime: Infinity).

      КАК ДОЛЖНО РАБОТАТЬ:
      Отдельно обрабатывать состояние ошибки (`isError`/`error`) и показывать
      понятный текст "Ошибка загрузки" (и кнопку повторить/перезагрузить),
      а "Нет данных" показывать только при успешном ответе с пустым списком.

    code_example: |
      // Проблемный код:
      const { data: items, isLoading } = useQuery<TopPart[]>({
        queryKey: [`/api/top-parts?mode=${mode}`],
      });

      if (isLoading) { ... }
      // error-state игнорируется -> items может быть undefined

      // Как исправить (пример):
      const { data: items, isLoading, isError, error } = useQuery<TopPart[]>({
        queryKey: [`/api/top-parts?mode=${mode}`],
      });
      if (isError) return <ErrorState message={String(error)} />;

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:30:56Z
        agrees: true
        note: "Раунд 2: UI маскирует ошибки API как 'нет данных'"

    fix: null

  - id: e-top-002
    file: py_backend/storage.py
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      `getTopParts()` учитывает "старые продажи" из `inventory.movements` (reason='sale', order_id IS NULL),
      но никак не учитывает возвраты этих продаж, которые оформляются отдельным movement
      с `reason='return'` (через `/api/movements/{movement_id}/return`).

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Если продажа была возвращена на склад, она продолжит учитываться в:
      - "Количество продаж" (totalSales)
      - доходности (avgProfit, profitMargin)
      - комбинированном коэффициенте
      и будет искусственно завышать рейтинг.

      КАК ДОЛЖНО РАБОТАТЬ:
      Для legacy-продаж, у которых существует возврат, нужно исключать продажу из аналитики
      (или вычитать возвращенное количество и соответствующую выручку/стоимость/доставку).
      Сейчас endpoint возврата делает только полный возврат, поэтому достаточно "исключить продажу".

    code_example: |
      # Проблемный код (legacy sales попадают в расчёт без учёта возврата):
      legacy_sales_rows = await self.inventoryPool.fetch(
        \"\"\"
        SELECT smart, qty_delta, sale_price, delivery_price
        FROM inventory.movements
        WHERE reason = 'sale' AND order_id IS NULL
        \"\"\"
      )

      for sale in legacy_sales_rows:
        ...
        acc[\"revenue\"] += sale_price * qty
        acc[\"cost\"] += avg_purchase * qty
        acc[\"deliveryCost\"] += delivery_price
        acc[\"totalSalesQty\"] += qty

      # Возврат legacy-продажи создаётся как отдельный movement:
      # routes.py: note = f\"Возврат продажи #{mid}\"
      # reason = \"return\"

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-1
        timestamp: 2026-02-10T14:35:48Z
        agrees: true
        note: "Раунд 2: legacy возвраты не уменьшают продажи/прибыль в рейтинге"

    fix: null


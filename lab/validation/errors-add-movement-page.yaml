      ПОЧЕМУ ЭТО ПЛОХО:
      Высокий риск забыть один ключ в одном из экранов (add-movement, stock-details и т.д.).

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Вынести в общий helper `invalidateMovementRelatedQueries(queryClient, smart)`.
    code_example: |
      # Текущий код:
      queryClient.invalidateQueries({ queryKey: ["/api/movements"] });
      queryClient.invalidateQueries({ queryKey: ["/api/stock"] });

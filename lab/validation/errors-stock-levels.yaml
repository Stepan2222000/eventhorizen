  - id: i-stock-002
    file: client/src/pages/stock-levels.tsx
    category: suboptimal

    issue: |
      ЧТО НЕ ТАК:
      Фильтрация и сортировка выполняются на каждом рендере без `useMemo`.
      Для страницы, которая по спецификации грузит весь список без лимита,
      это даёт лишнюю нагрузку на ввод фильтра и перерисовки.

      ПОЧЕМУ ЭТО ПЛОХО:
      При росте объёма данных интерфейс начнёт заметно "тормозить".

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Мемоизировать `filteredStock` и `sortedStock` по зависимостям
      (`stockLevels`, `filter`, `sortKey`, `sortDirection`).

    code_example: |
      # Текущий код:
      const filteredStock = ...
      const sortedStock = ...

      # Как улучшить:
      const filteredStock = useMemo(() => ..., [stockLevels, filter]);
      const sortedStock = useMemo(() => ..., [filteredStock, sortKey, sortDirection]);

    found_count: 1

  - id: i-stock-003
    file: client/src/pages/stock-levels.tsx
    category: suboptimal

    issue: |
      ЧТО НЕ ТАК:
      Данные запроса приводятся через небезопасный cast:
      `(stockLevels as StockLevel[] || [])`.

      ПОЧЕМУ ЭТО ПЛОХО:
      При дрейфе контракта API ошибка проявится только в рантайме
      (на этапе `.filter/.map`), а не в типах/валидации.

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Явно типизировать `useQuery<StockLevel[]>` и использовать дефолт
      `data: stockLevels = []`, либо парсить ответ через zod-схему.

    code_example: |
      # Текущий код:
      const { data: stockLevels, isLoading } = useQuery({ queryKey: ["/api/stock"] });
      const filteredStock = (stockLevels as StockLevel[] || []).filter(...)

      # Как улучшить:
      const { data: stockLevels = [], isLoading } = useQuery<StockLevel[]>({ queryKey: ["/api/stock"] });


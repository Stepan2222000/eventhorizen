      ПОЧЕМУ ЭТО ПЛОХО:
      - Любое изменение (новый reason, новый формат дат) нужно синхронно править в нескольких файлах.
      - Легко получить расхождения (например, где-то `transfer` обработан, а где-то нет).

      КАК СДЕЛАТЬ ЛУЧШЕ:
      Вынести в общие утилиты:

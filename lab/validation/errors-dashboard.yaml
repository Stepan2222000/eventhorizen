  - id: e-dash-008
    file: py_backend/routes.py
    category: error-handling
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      GET /api/movements перехватывает ошибки общим `except Exception`.
      При невалидном `boxNumber` из `storage.getMovements()` поднимается `InvalidRequestError`,
      но роут отдаёт 500 вместо 400.

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      Клиентские ошибки валидации выглядят как "падение сервера".
      Это ломает корректную обработку ошибок на клиенте и вводит в заблуждение.

      КАК ДОЛЖНО РАБОТАТЬ:
      `InvalidRequestError` должен явно маппиться на HTTP 400.

    code_example: |
      # py_backend/routes.py
      @app.get("/api/movements")
      async def get_movements(...):
        try:
          ...
        except Exception:
          return JSONResponse(status_code=500, ...)

      # expected
      except InvalidRequestError as err:
        return JSONResponse(status_code=400, content={"error": str(err)})

    found_count: 2
    rejected_count: 0

    findings:
      - agent: validator-codex
        timestamp: 2026-02-12T00:23:36+0400
        agrees: true
        note: "Раунд 2+5: перепроверено через цепочку routes.py -> storage.requireBoxName"
      - agent: validator-codex-browser
        timestamp: 2026-02-12T00:35:45+0400
        agrees: true
        note: |
          Практическая проверка через agent-browser:
          `GET /api/movements?boxNumber=bad%2Fbox` возвращает status 500 и body `{"error":"Failed to get movements"}`.
          Ошибка валидации параметра boxNumber маскируется под серверную.

    fix: null

  - id: e-dash-009
    file: client/src/components/sidebar.tsx
    category: logic-error
    severity: warning

    problem: |
      КАК СЕЙЧАС РАБОТАЕТ:
      Индикатор "Статус БД" рассчитывается как `dbHealth?.connected === true`.
      При первичном успехе `dbHealth` становится `{ connected: true }`.
      Если позже health-check падает (network error/abort), React Query сохраняет предыдущие data,
      поэтому UI продолжает показывать "Подключено".

      ЧТО МОЖЕТ ПОЙТИ НЕ ТАК:
      При временной недоступности backend/БД пользователь видит ложный "зелёный" статус
      и считает, что система в порядке.

      КАК ДОЛЖНО РАБОТАТЬ:
      При `isError` по `/api/health/db` индикатор должен переходить в состояние "Нет соединения"
      (или явно показывать "Ошибка проверки"), даже если ранее было успешное значение.

    code_example: |
      # client/src/components/sidebar.tsx
      const { data: dbHealth, isLoading: dbLoading } = useQuery({ queryKey: ["/api/health/db"], ... });
      const dbConnected = dbHealth?.connected === true;
      ...
      {dbLoading ? "Проверка..." : dbConnected ? "Подключено" : "Нет соединения"}

      # practical reproduce (agent-browser):
      network route "**/api/health/db" --abort
      wait > 15s (refetchInterval)
      # UI остаётся "Подключено"

    found_count: 1
    rejected_count: 0

    findings:
      - agent: validator-codex-browser
        timestamp: 2026-02-12T00:35:45+0400
        agrees: true
        note: |
          Практическая проверка через agent-browser:
          после `network route "**/api/health/db" --abort` и ожидания 17 секунд
          fetch на `/api/health/db` падает (`TypeError: Failed to fetch`), но текст в сайдбаре остаётся "Подключено".

    fix: null

